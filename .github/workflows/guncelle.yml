name: Fiyat Guncelle

on:
  schedule:
    - cron: '40 7 * * 1-5'   # 10:40 TR — sabah fiyat aciklamasi sonrasi
    - cron: '30 12 * * 1-5'  # 15:30 TR — yedek calisma
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fiyat-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright kur (Cloudflare yedegi)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fiyatlari cek
        run: python fetch_prices.py

      - name: Degisiklik varsa commitle
        run: |
          if ! git diff --quiet data.json; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add data.json
            git commit -m "Fiyat guncelleme $(TZ=Europe/Istanbul date +%d.%m.%Y)"
            git push
          else
            echo "data.json degismedi."
          fi
